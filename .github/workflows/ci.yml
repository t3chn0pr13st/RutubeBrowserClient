name: ci
# ВНИМАНИЕ: автозапуск отключён намеренно. GitHub Actions у аккаунта не
# выполняются (биллинг), поэтому каждый push и каждый PR давали упавший ран,
# который ничего не проверял. Тесты гоняются локально перед выпуском —
# см. раздел о выпуске пакетов в документации репозитория.
# Если Actions заработают, верните триггеры `push:` и `pull_request:`.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RutubeBrowserClient.slnx
      - run: dotnet build RutubeBrowserClient.slnx --configuration Release --no-restore
      - run: dotnet test RutubeBrowserClient.slnx --configuration Release --no-build
      - run: dotnet pack src/RutubeBrowserClient/RutubeBrowserClient.csproj --configuration Release --no-build --output artifacts
